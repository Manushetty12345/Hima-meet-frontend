# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE will override
# any settings specified in this file.

# Specifies the JVM arguments used for the Gradle daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true

# AndroidX support
android.useAndroidX=true

# Specifies which CPU architectures to build.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Enable React Native New Architecture.
newArchEnabled=true

# Enable Hermes JavaScript engine.
hermesEnabled=true

# Enable edge-to-edge display support.
edgeToEdgeEnabled=true

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9.
# Starting from AGP 10.x these opt outs will be removed.
android.builtInKotlin=false
android.newDsl=false

# AsyncStorage: Next Storage (Room-based), pinned to versions that support Kotlin 2.2
AsyncStorage_useNextStorage=true
AsyncStorage_kotlinVersion=2.2.0
AsyncStorage_next_roomVersion=2.8.4
AsyncStorage_next_kspVersion=2.2.0-2.0.2